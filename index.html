<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Inventário</title>
</head>
<body>
    <h1>Inventário da Loja</h1>
    <button onclick="adicionarProduto()">Adicionar Produto</button>
    <button onclick="removerUltimoProduto()">Remover Último Produto</button>
    <button onclick="modificarPreco()">Modificar Preço do Teclado</button>
    <button onclick="marcarForaDeEstoque()">Marcar Monitor como Fora de Estoque</button>
    <button onclick="exibirProdutosEmEstoque()">Exibir Produtos em Estoque</button>
    <button onclick="removerForaDeEstoque()">Remover Produtos Fora de Estoque</button>

    <div id="saida"></div>

    <script>
        // Código JavaScript
        let inventario = [
            { nome: 'RTX 4060', preco: 100, emEstoque: true },
            { nome: 'Mouse', preco: 50, emEstoque: false },
            { nome: 'Monitor', preco: 600, emEstoque: true }
        ];

        function adicionarProduto() {
            inventario.push({ nome: 'Cadeira Gamer', preco: 1200, emEstoque: true });
            atualizarSaida('Produto adicionado.');
        }

        function removerUltimoProduto() {
            inventario.pop();
            atualizarSaida('Último produto removido.');
        }

        function modificarPreco() {
            inventario[0].preco = 120;
            atualizarSaida('Preço do Teclado modificado.');
        }

        function marcarForaDeEstoque() {
            inventario[2].emEstoque = false;
            atualizarSaida('Monitor marcado como fora de estoque.');
        }

        function exibirProdutosEmEstoque() {
            let mensagem = 'Produtos em estoque:<br>';
            for (let i = 0; i < inventario.length; i++) {
                if (inventario[i].emEstoque) {
                    mensagem += inventario[i].nome + ' está em estoque.<br>';
                }
            }
            atualizarSaida(mensagem);
        }

        function removerForaDeEstoque() {
            inventario = inventario.filter(produto => produto.emEstoque);
            atualizarSaida('Produtos fora de estoque removidos.');
        }

        function atualizarSaida(mensagem) {
            document.getElementById('saida').innerHTML = mensagem;
            console.log(inventario); // Exibe o inventário no console para referência
        }
    </script>
</body>
</html>
